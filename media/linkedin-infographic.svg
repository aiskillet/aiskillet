<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fb703a" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b7b7b7"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a5a"/><stop offset="100%" stop-color="#fb703a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fb703a"/>
    </marker>
  </defs>

  <rect width="1080" height="1350" fill="#0a0a0a"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(400,84)">
    <rect x="0" y="0" width="52" height="52" rx="13" fill="url(#ember)"/>
    <circle cx="22" cy="27" r="12.5" fill="none" stroke="#140a05" stroke-width="4"/>
    <rect x="33" y="24" width="15" height="6" rx="3" fill="#140a05"/>
    <text x="68" y="37" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#ededed">AI<tspan fill="#fb703a">Skillet</tspan></text>
  </g>

  <!-- headline -->
  <text x="540" y="248" text-anchor="middle" font-size="72" font-weight="800" letter-spacing="-3" fill="url(#ink)">Write a skill once.</text>
  <text x="540" y="334" text-anchor="middle" font-size="72" font-weight="800" letter-spacing="-3" fill="url(#ink)">Install it <tspan fill="#fb703a">anywhere</tspan>.</text>
  <text x="540" y="404" text-anchor="middle" font-size="29" fill="#a0a0a0">The technology-agnostic marketplace for AI skills, agents &amp; MCP.</text>

  <!-- command -->
  <g transform="translate(150,452)">
    <rect x="0" y="0" width="780" height="76" rx="15" fill="#050505" stroke="#2a2320" stroke-width="1.5"/>
    <text x="30" y="48" font-size="24" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" fill="#fb703a">$</text>
    <text x="58" y="48" font-size="24" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" fill="#ededed">npx @aiskillet/cli add code-review --target cursor</text>
  </g>

  <!-- ===== FLOW DIAGRAM ===== -->
  <!-- arrow source -> skillet -->
  <line x1="306" y1="712" x2="354" y2="712" stroke="#fb703a" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- skillet -> 4 targets -->
  <g stroke="#fb703a" stroke-width="3" fill="none">
    <path d="M580,712 C628,712 628,634 674,634" marker-end="url(#arrow)"/>
    <path d="M580,712 C628,712 628,690 674,690" marker-end="url(#arrow)"/>
    <path d="M580,712 C628,712 628,746 674,746" marker-end="url(#arrow)"/>
    <path d="M580,712 C628,712 628,802 674,802" marker-end="url(#arrow)"/>
  </g>

  <!-- source node -->
  <g transform="translate(96,670)">
    <rect x="0" y="0" width="210" height="84" rx="14" fill="#151311" stroke="#3a2f28" stroke-width="2"/>
    <text x="105" y="44" text-anchor="middle" font-size="24" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#ededed">SKILL.md</text>
    <text x="105" y="68" text-anchor="middle" font-size="16" fill="#8a8a8a">write once</text>
  </g>
  <!-- compiler node -->
  <g transform="translate(360,670)">
    <rect x="0" y="0" width="220" height="84" rx="14" fill="#1a0f09" stroke="#fb703a" stroke-width="2.5"/>
    <text x="110" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#ff9a5a">🍳 skillet</text>
    <text x="110" y="68" text-anchor="middle" font-size="15" font-family="'JetBrains Mono',monospace" fill="#a0a0a0">add --target …</text>
  </g>
  <!-- target pills -->
  <g font-size="23" font-weight="700" fill="#ededed" text-anchor="middle">
    <g transform="translate(680,611)"><rect width="320" height="46" rx="23" fill="#151311" stroke="#3a2f28" stroke-width="2"/><text x="160" y="31">Claude Code</text></g>
    <g transform="translate(680,667)"><rect width="320" height="46" rx="23" fill="#151311" stroke="#3a2f28" stroke-width="2"/><text x="160" y="31">Cursor</text></g>
    <g transform="translate(680,723)"><rect width="320" height="46" rx="23" fill="#151311" stroke="#3a2f28" stroke-width="2"/><text x="160" y="31">AGENTS.md</text></g>
    <g transform="translate(680,779)"><rect width="320" height="46" rx="23" fill="#151311" stroke="#3a2f28" stroke-width="2"/><text x="160" y="31">AgentVoy</text></g>
  </g>
  <text x="540" y="880" text-anchor="middle" font-size="24" fill="#a0a0a0">One source, compiled to each tool — <tspan fill="#fb703a" font-weight="700">run anywhere</tspan>.</text>

  <!-- stats -->
  <g text-anchor="middle">
    <g transform="translate(228,978)"><text x="0" y="0" font-size="66" font-weight="800" letter-spacing="-3" fill="url(#ink)">74</text><text x="0" y="38" font-size="18" fill="#6e6e6e" letter-spacing="1.5">CAPABILITIES</text></g>
    <g transform="translate(437,978)"><text x="0" y="0" font-size="66" font-weight="800" letter-spacing="-3" fill="url(#ink)">4</text><text x="0" y="38" font-size="18" fill="#6e6e6e" letter-spacing="1.5">FORMATS</text></g>
    <g transform="translate(643,978)"><text x="0" y="0" font-size="66" font-weight="800" letter-spacing="-3" fill="url(#ink)">10</text><text x="0" y="38" font-size="18" fill="#6e6e6e" letter-spacing="1.5">CATEGORIES</text></g>
    <g transform="translate(852,978)"><text x="0" y="0" font-size="66" font-weight="800" letter-spacing="-3" fill="url(#ink)">MIT</text><text x="0" y="38" font-size="18" fill="#6e6e6e" letter-spacing="1.5">OPEN SOURCE</text></g>
  </g>

  <!-- security block -->
  <g transform="translate(120,1046)">
    <rect x="0" y="0" width="840" height="140" rx="18" fill="#0d120d" stroke="#2f7d4f" stroke-width="2"/>
    <text x="420" y="46" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="2.5" fill="#4ade80">🔒  SECURE BY DESIGN</text>
    <g font-size="21" fill="#cfe9d6" text-anchor="middle">
      <text x="420" y="86">Never runs untrusted code  ·  CI-scanned for injection &amp; secrets</text>
      <text x="420" y="116">Commit-pinned  ·  every listing links to its exact source</text>
    </g>
  </g>

  <!-- footer -->
  <text x="540" y="1268" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#ededed">aiskillet<tspan fill="#fb703a">.com</tspan></text>
  <text x="540" y="1306" text-anchor="middle" font-size="21" fill="#6e6e6e">Cook up your agents.</text>
</svg>
