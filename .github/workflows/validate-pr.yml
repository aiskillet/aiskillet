name: Validate PR

on:
  pull_request:
    paths:
      - "entries/**"
      - "schema/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: community PRs may only touch entries/ (and docs).
      - name: Enforce entries-only for external changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          bad="$(echo "$changed" | grep -vE '^(entries/|README|\.github/PULL_REQUEST_TEMPLATE/)' || true)"
          if [ -n "$bad" ]; then
            echo "::warning::PR touches non-entry paths (maintainer review required):"
            echo "$bad"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Tier 1 — manifest validation + install safety
        run: npm run validate
      # Tier 2 (source scan: gitleaks/trufflehog + semgrep) is added in Phase 1.
